<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公主今天吃啥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EAF0FA; --paper:#FFFFFF; --denim:#3457A0; --denim-2:#5B7FC4; --denim-soft:#D6E1F5;
  --berry:#F08FA8; --berry-soft:#FDE3EA; --butter:#FFD66B; --ink:#1E2944; --muted:#5E6A86;
  --line:#C9D5EC; --good:#3FA56B; --warn:#E3A21A; --bad:#D9534F;
  --display:"Huninn","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 40px;
  background-image:radial-gradient(var(--denim-soft) 1.2px,transparent 1.3px);background-size:22px 22px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quest{flex:1;display:flex;gap:6px;min-width:200px}
.quest i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .3s}
.quest i.on{background:var(--denim)}
.quest i.now{background:var(--berry)}
.count{font-family:var(--display);background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{color:var(--berry);font-size:18px;font-weight:400}

/* card */
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:26px 22px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--denim);font-weight:700;margin-bottom:4px}
.q{font-size:clamp(24px,5.5vw,32px);line-height:1.25;margin-bottom:6px}
.hint{color:var(--muted);margin:0 0 18px}

/* welcome */
.welcome{text-align:center;padding:30px 20px 26px;overflow:hidden}
.stage{position:relative;height:300px;margin:6px auto 10px;max-width:560px}
.stage img{position:absolute;filter:drop-shadow(0 6px 8px rgba(30,41,68,.18))}
.stage .peace{left:2%;bottom:0;height:88%;animation:bob 3.2s ease-in-out infinite}
.stage .explorer{right:3%;bottom:4%;height:82%;animation:bob 3.6s ease-in-out infinite .6s}
.stage .reader{left:50%;transform:translateX(-50%);bottom:0;height:62%}
.badge{border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2.5px var(--ink);object-fit:cover}
.stage .b1{width:74px;height:74px;left:30%;top:4%;animation:bob 4s ease-in-out infinite .3s}
.stage .b2{width:64px;height:64px;right:28%;top:0;animation:bob 3.4s ease-in-out infinite 1s}
@keyframes bob{50%{translate:0 -8px}}
.crown{display:block;margin:0 auto 4px;width:54px}
.welcome h1{font-size:clamp(32px,8vw,52px);line-height:1.15}
.welcome h1 em{font-style:normal;color:var(--berry);-webkit-text-stroke:0}
.welcome p{color:var(--muted);margin:8px 0 20px}

.btn{border:2.5px solid var(--ink);border-radius:99px;padding:10px 22px;background:var(--paper);font-family:var(--display);font-size:17px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--berry);color:#fff}
.btn.denim{background:var(--denim);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{font-size:21px;padding:12px 34px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* option tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{border:2.5px solid var(--ink);border-radius:20px;background:var(--paper);padding:16px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,background .15s}
.tile svg{width:52px;height:52px}
.tile .t{font-family:var(--display);font-size:20px}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.tile:hover{transform:translateY(-3px)}
.tile:disabled{opacity:.45;cursor:not-allowed;transform:none;border-style:dashed}
.chip.ghost{border-style:dashed;opacity:.5;cursor:not-allowed}
.sub{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:18px 0 8px}
.rinfo{text-align:left;background:var(--ground);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;display:grid;gap:4px}
.rinfo b{color:var(--denim);font-weight:700;margin-right:6px}
.star{color:#D99A00;font-weight:700}
.tile[aria-pressed="true"]{background:var(--butter);box-shadow:4px 4px 0 var(--ink);transform:translateY(-3px)}

/* HP bar */
.hp-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hp-face{width:96px;height:96px;flex:none}
.hp-meta{flex:1;min-width:180px}
.hp-label{font-family:var(--display);font-size:24px}
.hp-sub{color:var(--muted);font-size:14px}
.hp{display:flex;gap:4px;margin:18px 0 10px;padding:6px;border:2.5px solid var(--ink);border-radius:14px;background:var(--ink)}
.hp span{flex:1;height:26px;border-radius:6px;background:#3a4668;transition:background .2s}
.hp span.on{background:var(--hpc,var(--good))}
input[type=range]{width:100%;accent-color:var(--berry);height:28px}
.hp-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{background:var(--denim-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin-top:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2.5px solid var(--ink);border-radius:99px;padding:8px 16px 8px 12px;background:var(--paper);font-family:var(--display);font-size:17px;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .15s}
.chip .box{width:20px;height:20px;border:2.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--denim);color:#fff}
.chip[aria-pressed="true"] .box{background:var(--butter)}
.chip[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border:solid var(--ink);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.chip small{font-family:var(--body);font-size:12px;opacity:.75}
.minor{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--denim);text-decoration:underline;text-underline-offset:3px;padding:4px 2px;font-size:14px}

/* delete list */
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ditem{border:2px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--paper);transition:opacity .25s,transform .25s}
.ditem .info{flex:1;min-width:0}
.ditem .nm{font-weight:700;line-height:1.3}
.ditem .mt{font-size:12px;color:var(--muted)}
.x{width:34px;height:34px;flex:none;border:2px solid var(--ink);border-radius:50%;background:var(--berry-soft);display:grid;place-items:center;font-size:18px;line-height:1}
.x:hover{background:var(--berry);color:#fff}
.ditem.gone{opacity:.4;background:repeating-linear-gradient(135deg,#fff 0 8px,#f4f6fb 8px 16px)}
.ditem.gone .nm{text-decoration:line-through}
.ditem.gone .x{background:var(--denim-soft)}
.trash{margin-top:14px;font-size:14px;color:var(--muted)}

/* wheel */
.wheel-box{position:relative;width:min(420px,100%);aspect-ratio:1;margin:8px auto 0;max-width:100%}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:36px;height:44px;z-index:2;filter:drop-shadow(2px 2px 0 var(--ink))}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--berry);color:#fff;font-family:var(--display);font-size:clamp(16px,4vw,22px);box-shadow:3px 3px 0 var(--ink);z-index:2}
.spin:disabled{background:#c9cfdf}
.wheel-side{position:absolute;right:-14px;bottom:-10px;width:92px;pointer-events:none}
.summary{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 6px}
.pill{font-size:12.5px;background:var(--denim-soft);color:var(--denim);border-radius:99px;padding:2px 10px;font-weight:500}

/* empty */
.empty{text-align:center;padding:10px}
.empty img{width:110px;height:110px;margin-bottom:8px}

/* result */
.modal{position:fixed;inset:0;background:rgba(30,41,68,.55);display:grid;place-items:center;padding:16px;z-index:10}
.result{max-width:420px;width:100%;text-align:center;padding-top:20px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.result img{height:170px;margin:-70px auto 0;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.result .kicker{font-family:var(--display);color:var(--berry);font-size:18px;margin-top:4px}
.result h2{font-size:clamp(28px,7vw,38px);margin:4px 0}
.result .meta{color:var(--muted);font-size:14px}
.result .acts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
.sample{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}

@media (max-width:480px){
  .card{padding:22px 16px;box-shadow:4px 4px 0 var(--ink)}
  .stage{height:230px}
  .stage .b1{width:52px;height:52px;left:0;top:0}
  .stage .b2{width:48px;height:48px;right:0;top:0}
  .stage .reader{height:54%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function howGo(r,full){if(S.mode==="delivery")return "叫外送";if(S.mode==="drive")return `開車 ${r.car} 分${full?"鐘":""}`;return `${S.mode==="takeout"?"外帶，":""}${r.via||"走"} ${r[S.loc]} 分${full?"鐘":""}`;}
const rate=r=>r.star?`<span class="star">★ ${r.star.toFixed(1)}${r.rev?`(${r.rev.toLocaleString()})`:""}</span>`:"";
function walkMax(){ // 體力 → 可以走幾分鐘
  let m=S.hp<=10?0:Math.round(S.hp/100*45);
  if(S.mode==="rain") m=Math.floor(m/2);
  return m;
}
function hpText(){
  const h=S.hp;
  if(h<=10) return ["已躺平","連下樓都不想，只能靠外送",IMG.think,"var(--bad)"];
  if(h<=35) return ["殘血狀態","頂多走到巷口",IMG.hug,"var(--warn)"];
  if(h<=70) return ["還可以","走一小段沒問題",IMG.hand,"var(--good)"];
  return [S.hp>=80?"滿血可以遠征":"體力充足",S.hp>=80?"連寧夏夜市都衝得到！":"遠一點的也行",IMG.explorer,"var(--good)"];
}
// 台北時間：現在有沒有開（沒填營業時間就當作有開）
function nowTPE(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value; return {day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),min:(+g("hour")%24)*60+ +g("minute")};}
const toMin=s=>{const [h,m]=s.split(":");return +h*60+ +m};
// 一小時內會開的也算，方便先決定
function openNow(r){const n=nowTPE();
  if(r.off&&r.off.includes(n.day)) return false;
  if(r.open){const a=(toMin(r.open[0])-60+1440)%1440,b=toMin(r.open[1]); if(b>a?(n.min<a||n.min>=b):(n.min<a&&n.min>=b)) return false;}
  return true;}
const OPEN=()=>DATA.filter(openNow);
function pool(opts={}){
  const upto=opts.upto??STEPS.length;
  return OPEN().filter(r=>{
    const d=S.loc?r[S.loc]:0;
    if(S.loc && d==null) return false;
    const si=i=>STEPS.indexOf(i)<upto;
    if(si("hp")||si("mode")){
      const wm=S.relax?99:(si("hp")?walkMax():99);
      if(S.mode==="delivery"){ if(!r.del) return false; }
      else if(S.mode==="takeout"){ if(!r.out||d>wm) return false; }
      else if(S.mode==="rain"){ if(!(d<=wm||r.del)) return false; }
      else if(S.mode==="sunny"){ if(d>wm) return false; }
      else if(S.mode==="drive"){ if(r.car==null||r.car>(S.relax?99:(si("hp")?carMax():99))) return false; }
    }
    if(si("cats") && !r.t.some(x=>S.cats.has(x))) return false;
    if(si("trash") && S.trash.has(r.n)) return false;
    return true;
  });
}
function upd(){ document.getElementById("cnt").textContent=pool({upto:S.step}).length; }

function quest(){
  const q=document.getElementById("quest");
  q.innerHTML=STEPS.map((_,i)=>`<i class="${i<S.step-1?'on':i===S.step-1?'now':''}"></i>`).join("");
}
function go(n){ S.step=n; render(); window.scrollTo({top:0,behavior:"smooth"}); }
const nav=(ok=true,nextLabel="下一步")=>`<div class="nav"><button class="btn" id="back">← 上一步</button><button class="btn denim" id="next" ${ok?"":"disabled"}>${nextLabel} →</button></div>`;
function bindNav(){
  const b=document.getElementById("back"),n=document.getElementById("next");
  b&&(b.onclick=()=>go(S.step-1)); n&&(n.onclick=()=>go(S.step+1));
}
const pname={1:"小資",2:"普通",3:"犒賞"};
const mname={sunny:"晴天",rain:"下大雨",takeout:"外帶",delivery:"叫外送",drive:"開車"};

function render(){
  document.getElementById("bar").hidden=S.step===0;
  quest();
  const k=S.step===0?"welcome":STEPS[S.step-1];
  VIEWS[k](); upd();
}

const VIEWS={
welcome(){
  app.innerHTML=`<section class="card welcome">
    <svg class="crown" viewBox="0 0 60 36" aria-hidden="true"><path d="M4 32 8 8l12 12L30 4l10 16L52 8l4 24z" fill="#FFD66B" stroke="#1E2944" stroke-width="3" stroke-linejoin="round"/><circle cx="30" cy="4" r="3" fill="#F08FA8"/></svg>
    <h1>請問<em>公主</em>今天想吃啥</h1>
    <p>回答幾個小問題，剩下的交給命運轉盤</p>
    <div class="stage" aria-hidden="true">
      <img class="badge b1" src="${IMG.hug}" alt="">
      <img class="badge b2" src="${IMG.think}" alt="">
      <img class="peace" src="${IMG.peace}" alt="">
      <img class="reader" src="${IMG.reader}" alt="">
      <img class="explorer" src="${IMG.explorer}" alt="">
    </div>
    <button class="btn primary big" id="start">開始點餐任務</button>
  </section>`;
  document.getElementById("start").onclick=()=>go(1);
},
loc(){
  app.innerHTML=`<section class="card">
    <div class="eyebrow">第 1 關・出發地</div>
    <h2 class="q">公主現在人在哪？</h2>
    <p class="hint">決定附近有哪些店可以選</p>
    <div class="tiles">
      ${tile("loc","home",IC.home,"在家",locSub("home"),!locN("home"))}
      ${tile("loc","dorm",IC.dorm,"宿舍",locSub("dorm"),!locN("dorm"))}
    </div>${nav(!!S.loc)}</section>`;
  bindTiles("loc"); bindNav();
},
mode(){
  app.innerHTML=`<section class="card">
    <div class="eyebrow">第 2 關・天氣與取餐</div>
    <h2 class="q">外面天氣怎樣？想怎麼吃？</h2>
    <p class="hint">下雨會自動縮短步行距離，外送就不用管走多遠</p>
    <div class="tiles">
      ${tile("mode","sunny",IC.sun,"晴天","出門內用走走")}
      ${tile("mode","rain",IC.rain,"下大雨","近一點或外送")}
      ${tile("mode","takeout",IC.bag,"外帶",modeN("takeout")?"買回來慢慢吃":"名單裡還沒有可外帶的店",!modeN("takeout"))}
      ${tile("mode","delivery",IC.moto,"叫外送",modeN("delivery")?"不出門，等人送":"名單裡還沒有外送的店",!modeN("delivery"))}
      ${S.loc==="home"?tile("mode","drive",IC.car,"開車","開車出去吃遠一點"):""}
    </div>${nav(!!S.mode)}</section>`;
  bindTiles("mode"); bindNav();
},
hp(){
  const deliv=S.mode==="delivery";
  app.innerHTML=`<section class="card">
    <div class="eyebrow">第 3 關・體力檢定</div>
    <h2 class="q">公主現在還剩多少體力？</h2>
    <p class="hint">拖拉體力條，越沒力就只留越近的店</p>
    <div class="hp-top">
      <img class="hp-face badge" id="hpface" alt="">
      <div class="hp-meta"><div class="hp-label disp" id="hplabel"></div><div class="hp-sub" id="hpsub"></div></div>
    </div>
    <div class="hp" id="hpbar">${"<span></span>".repeat(10)}</div>
    <label for="hpr" class="hint" style="display:block;margin:0">體力值 <b id="hpv"></b></label>
    <input type="range" id="hpr" min="0" max="100" step="5" value="${S.hp}">
    <div class="hp-scale"><span>0 躺平</span><span>50</span><span>100 滿血</span></div>
    <div class="note" id="hpnote"></div>
    ${nav(true)}</section>`;
  const r=document.getElementById("hpr");
  const paint=()=>{
    S.hp=+r.value; const [l,s,img,col]=hpText();
    document.getElementById("hplabel").textContent=l;
    document.getElementById("hpsub").textContent=s;
    document.getElementById("hpface").src=img;
    document.getElementById("hpv").textContent=S.hp;
    const bar=document.getElementById("hpbar"); bar.style.setProperty("--hpc",col);
    [...bar.children].forEach((sp,i)=>sp.classList.toggle("on",i<Math.ceil(S.hp/10)));
    const wm=walkMax();
    document.getElementById("hpnote").innerHTML=deliv
      ?"外送模式：躺平也沒關係，體力不影響結果"
      :S.mode==="drive"?`開車模式：最遠開 <b>${carMax()}</b> 分鐘`
      :`最遠 <b>${wm}</b> 分鐘（走路或搭車）${S.mode==="rain"?"（下雨打對折，另外有外送的店也會保留）":""}`;
    upd();
  };
  r.oninput=paint; paint(); bindNav();
},
cats(){
  const base=pool({upto:3});
  const n=c=>base.filter(r=>r.t.includes(c)).length;
  app.innerHTML=`<section class="card">
    <div class="eyebrow">第 4 關・口味勾選</div>
    <h2 class="q">今天的胃想要哪幾種？</h2>
    <p class="hint">可以多選。一家店可能有好幾個標籤，只要有一個被勾到就會上轉盤</p>
    <div class="chips">${CATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${S.cats.has(c)}"><span class="box"></span>${c} <small>${n(c)}</small></button>`).join("")}</div>
    ${EXTRA.length?`<div class="sub">其他口味・名單上還沒有店</div><div class="chips">${EXTRA.map(c=>`<button class="chip ghost" disabled title="補上這類的店就能勾了"><span class="box"></span>${c} <small>0</small></button>`).join("")}</div>`:""}
    <div class="minor"><button class="link" id="all">全部都可以</button><button class="link" id="none">全部清掉</button></div>
    ${nav(S.cats.size>0)}</section>`;
  app.querySelectorAll(".chip:not(.ghost)").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c; S.cats.has(c)?S.cats.delete(c):S.cats.add(c);
    b.setAttribute("aria-pressed",S.cats.has(c)); document.getElementById("next").disabled=!S.cats.size; upd();
  });
  document.getElementById("all").onclick=()=>{S.cats=new Set(CATS);VIEWS.cats();upd();bindNav()};
  document.getElementById("none").onclick=()=>{S.cats.clear();VIEWS.cats();upd();bindNav()};
  bindNav();
},
trash(){
  const list=pool({upto:4});
  app.innerHTML=`<section class="card">
    <div class="eyebrow">第 5 關・淘汰賽</div>
    <h2 class="q">有哪家今天就是不想吃？</h2>
    <p class="hint">按 ✕ 丟進垃圾桶，按錯再按一次撿回來</p>
    ${list.length?`<div class="dlist">${list.map(r=>{const d=r[S.loc];return `<div class="ditem ${S.trash.has(r.n)?'gone':''}" data-n="${r.n}">
      <div class="info"><div class="nm">${r.n}</div><div class="mt">${r.c}・${howGo(r)}${r.star?`・${rate(r)}`:""}${r.sup?"・補充":""}</div></div>
      <button class="x" aria-label="淘汰 ${r.n}">${S.trash.has(r.n)?"↺":"✕"}</button></div>`}).join("")}</div>
      <div class="trash" id="trashinfo"></div>`:emptyBox()}
    ${nav(list.length>0,"去轉盤")}</section>`;
  const info=()=>{const t=list.filter(r=>S.trash.has(r.n)).length;const el=document.getElementById("trashinfo");if(el)el.textContent=t?`垃圾桶裡有 ${t} 家`:"還沒淘汰任何一家"; document.getElementById("next").disabled=list.length-t===0;};
  app.querySelectorAll(".ditem").forEach(el=>el.querySelector(".x").onclick=()=>{
    const n=el.dataset.n; S.trash.has(n)?S.trash.delete(n):S.trash.add(n);
    el.classList.toggle("gone"); el.querySelector(".x").textContent=S.trash.has(n)?"↺":"✕"; info(); upd();
  });
  info(); bindNav(); bindEmpty();
},
wheel(){
  const list=pool();
  const pills=[S.loc==="home"?"在家":"宿舍",mname[S.mode],S.mode==="delivery"?"體力不限":(S.relax?"體力不限":S.mode==="drive"?`開車 ≤ ${carMax()} 分`:`最遠 ${walkMax()} 分`)];
  app.innerHTML=`<section class="card" style="text-align:center">
    <div class="eyebrow">最終關・命運轉盤</div>
    <h2 class="q">轉下去，吃什麼聽它的</h2>
    <div class="summary">${pills.map(p=>`<span class="pill">${p}</span>`).join("")}</div>
    ${list.length?`<div class="wheel-box">
      <svg class="pointer" viewBox="0 0 36 44"><path d="M4 4h28L18 40z" fill="#F08FA8" stroke="#1E2944" stroke-width="3" stroke-linejoin="round"/></svg>
      <canvas id="wheel" width="840" height="840"></canvas>
      <button class="spin" id="spin">轉！</button>
    </div>`:emptyBox()}
    <div class="nav"><button class="btn" id="back">← 上一步</button><button class="btn" id="restart">從頭再來</button></div>
  </section>`;
  bindNav(); bindEmpty();
  document.getElementById("restart").onclick=reset;
  if(list.length){ W.list=list; W.rot=W.rot||0; drawWheel(); document.getElementById("spin").onclick=spin; }
}
};

const locN=l=>OPEN().filter(r=>r[l]!=null).length;
const locSub=l=>{const n=locN(l);return n?`附近有 ${n} 家現在有開`:(DATA.some(r=>r[l]!=null)?"附近的店現在都沒開":"名單還沒填這邊的店")};
const modeN=m=>OPEN().filter(r=>r[S.loc]!=null&&(m==="delivery"?r.del:r.out)).length;
function tile(key,val,icon,t,s,dis=false){return `<button class="tile" data-k="${key}" data-v="${val}" aria-pressed="${S[key]===val}" ${dis?"disabled":""}>${icon}<span class="t">${t}</span><span class="s">${s}</span></button>`}
function bindTiles(key){
  app.querySelectorAll(`.tile[data-k="${key}"]`).forEach(b=>b.onclick=()=>{
    S[key]=b.dataset.v; S.relax=false;
    app.querySelectorAll(`.tile[data-k="${key}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.getElementById("next").disabled=false; upd();
    setTimeout(()=>go(S.step+1),260);
  });
}
function emptyBox(){return `<div class="empty"><img class="badge" src="${IMG.think}" alt=""><h3 class="disp" style="font-size:22px">條件太嚴格，一家都不剩了</h3><p class="hint">可以放寬體力限制，或回上一步多勾幾個</p><button class="btn primary" id="relax">放寬體力限制</button></div>`}
function bindEmpty(){const b=document.getElementById("relax"); b&&(b.onclick=()=>{S.relax=true;render()});}
function reset(){S.loc=null;S.mode=null;S.hp=60;S.cats=new Set(CATS);S.trash.clear();S.relax=false;W.rot=0;go(0)}

/* ====== 轉盤 ====== */
const W={list:[],rot:0,spinning:false};
const COLORS=["#3457A0","#F08FA8","#FFD66B","#5B7FC4","#FDE3EA","#D6E1F5"];
const TXT={"#3457A0":"#fff","#5B7FC4":"#fff"};
function drawWheel(){
  const c=document.getElementById("wheel"); if(!c) return;
  const x=c.getContext("2d"),R=c.width/2,n=W.list.length,a=2*Math.PI/n;
  x.clearRect(0,0,c.width,c.height);
  x.save(); x.translate(R,R); x.rotate(W.rot);
  const pal=n%COLORS.length===1?COLORS.slice(0,5):COLORS;
  W.list.forEach((r,i)=>{
    const col=n===1?COLORS[1]:pal[i%pal.length];
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,R-14,i*a-Math.PI/2,(i+1)*a-Math.PI/2); x.closePath();
    x.fillStyle=col; x.fill(); x.lineWidth=5; x.strokeStyle="#1E2944"; x.stroke();
    x.save(); x.rotate(i*a+a/2-Math.PI/2);
    x.fillStyle=TXT[col]||"#1E2944"; x.textAlign="right"; x.textBaseline="middle";
    const fs=Math.max(22,Math.min(40,300/n+14));
    x.font=`${fs}px Huninn, "Noto Sans TC", sans-serif`;
    const full=r.s||r.n; let t=full; const maxW=R*0.62; while(x.measureText(t).width>maxW&&t.length>2) t=t.slice(0,-1);
    if(t!==full) t=t.slice(0,-1)+"…";
    x.fillText(t,R-44,0); x.restore();
  });
  x.restore();
  x.beginPath(); x.arc(R,R,R-8,0,2*Math.PI); x.lineWidth=12; x.strokeStyle="#1E2944"; x.stroke();
  for(let i=0;i<24;i++){const t=i/24*2*Math.PI; x.beginPath(); x.arc(R+Math.cos(t)*(R-8),R+Math.sin(t)*(R-8),4,0,2*Math.PI); x.fillStyle=i%2?"#FFD66B":"#fff"; x.fill();}
}
function spin(){
  if(W.spinning) return; W.spinning=true;
  const btn=document.getElementById("spin"); btn.disabled=true;
  const n=W.list.length,a=2*Math.PI/n,win=Math.floor(Math.random()*n);
  // 讓 win 的中心停在正上方（指針）
  const target=-(win*a+a/2)+(Math.random()-.5)*a*0.6;
  const cur=W.rot%(2*Math.PI);
  let delta=target-cur; while(delta<0) delta+=2*Math.PI;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const total=delta+(reduce?0:2*Math.PI*6), dur=reduce?10:4800, start=performance.now(), from=W.rot;
  const ease=t=>1-Math.pow(1-t,4);
  (function f(now){
    const t=Math.min(1,(now-start)/dur); W.rot=from+total*ease(t); drawWheel();
    if(t<1) requestAnimationFrame(f); else { W.spinning=false; btn.disabled=false; showResult(W.list[win]); }
  })(start);
}
function showResult(r){
  const d=r[S.loc];
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card result" role="dialog" aria-modal="true" aria-labelledby="rname">
    <img src="${IMG.peace}" alt="">
    <div class="kicker">就決定是你了！</div>
    <h2 id="rname">${r.n}</h2>
    <div class="meta">${r.t.join("・")}｜${howGo(r,true)}${r.star?`｜${rate(r)}`:""}</div>
    ${(r.note||r.g||r.two||r.open||r.off||r.sup)?`<div class="rinfo">
      ${r.g?`<div><b>Google</b>${r.g}</div>`:""}
      ${r.h24?`<div><b>營業</b>24 小時</div>`:""}
      ${r.sup?`<div><b>註記</b>評分未滿 4.0 或評論未滿 100 則，放在補充名單</div>`:""}
      ${r.note?`<div><b>推薦</b>${r.note}</div>`:""}
      ${r.two?`<div><b>兩人</b>約 ${r.two} 元</div>`:""}
      ${r.open?`<div><b>營業</b>${r.open[0]}–${r.open[1]}</div>`:""}
      ${r.off?`<div><b>公休</b>${r.off.map(d=>"週"+"日一二三四五六"[d]).join("、")}</div>`:""}
    </div>`:""}
    <div class="acts">
      <button class="btn primary big" id="ok">好，就吃這家</button>
      <button class="btn" id="again">不要這家，排除後再轉</button>
    </div></div>`;
  document.body.appendChild(m); document.getElementById("ok").focus();
  confetti();
  document.getElementById("ok").onclick=()=>{m.remove();
    app.innerHTML=`<section class="card welcome"><img src="${IMG.explorer}" alt="" style="height:200px"><h1 style="font-size:clamp(28px,7vw,40px)">出發！去吃 <em>${r.n}</em></h1><p>祝公主用餐愉快</p><button class="btn" id="restart">再抽一次</button></section>`;
    document.getElementById("restart").onclick=reset; document.getElementById("bar").hidden=true;};
  document.getElementById("again").onclick=()=>{m.remove();S.trash.add(r.n);render();};
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"); c.hidden=false;
  const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:120},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:Math.random()*8+5,r:Math.random()*6,col:COLORS[Math.floor(Math.random()*4)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<110) requestAnimationFrame(f); else c.hidden=true;})();
}
document.fonts&&document.fonts.ready.then(()=>{if(W.list.length)drawWheel()});
(function(){const all=DATA.length,o=OPEN().length;document.getElementById("foot").textContent=`口袋名單共 ${all} 家`+(all>o?`，現在沒開的 ${all-o} 家先藏起來`:"");})();
render();
</script>
